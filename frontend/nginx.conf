server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container (see docker-compose.yml —
    # the service is reachable by its service name, "backend", on the
    # shared Docker network).
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: any other route is handled by React Router client-side.
    location / {
        try_files $uri /index.html;
    }
}
