# Full local stack for VenturePulse: Postgres + backend API + frontend.
#
# Usage:
#   1. Copy .env.example to .env in the project root and fill in
#      OPENAI_API_KEY and JWT_SECRET (DATABASE_URL is set for you below
#      to point at the "db" service).
#   2. docker compose up --build
#   3. Run migrations once, in a second terminal:
#      docker compose exec backend npx prisma migrate deploy
#   4. Open http://localhost:8080
#
# This is a straightforward local/demo stack, not a hardened production
# deployment (no TLS termination, no secrets manager, single replica).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: venturepulse
      POSTGRES_PASSWORD: venturepulse
      POSTGRES_DB: venturepulse
    ports:
      - '5432:5432'
    volumes:
      - venturepulse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U venturepulse']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      CLIENT_URL: http://localhost:8080
      DATABASE_URL: postgresql://venturepulse:venturepulse@db:5432/venturepulse?schema=public
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  venturepulse_db_data:
